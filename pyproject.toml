[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sudroid"
dynamic = ["version"]
description = "Android rooting toolkit: detect, back up, patch, test-boot, flash"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Mher Saratikyan" }]
keywords = ["android", "root", "magisk", "fastboot", "adb", "heimdall"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Hardware",
  "Topic :: Utilities",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "platformdirs>=4.2",
  "httpx>=0.27",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
sudroid = "sudroid.cli:app"

[project.urls]
Homepage = "https://github.com/sarat1kyan/suDROID"
Issues = "https://github.com/sarat1kyan/suDROID/issues"
Changelog = "https://github.com/sarat1kyan/suDROID/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "sudroid/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["sudroid"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
packages = ["sudroid"]

[[tool.mypy.overrides]]
module = ["lz4.*", "tomli"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["sudroid"]
omit = ["sudroid/__main__.py"]
